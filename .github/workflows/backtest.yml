name: Backtest DXY/Gold strategy

on:
  workflow_dispatch:
    inputs:
      outputsize:
        description: 'Antall historiske barer å hente per symbol/interval (Twelve Data gratisplan tåler vanligvis opptil 5000)'
        required: false
        default: '5000'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BACKTEST_OUTPUTSIZE: ${{ github.event.inputs.outputsize }}
        run: node src/backtest.js

      - name: Commit backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/backtest.json
          git diff --staged --quiet || git commit -m "Backtest results [skip ci]"
          git push
